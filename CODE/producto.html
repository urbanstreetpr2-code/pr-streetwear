<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIKE NOCTA X DRAKE | URBAN STREET PR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            PR
        </div>

        <nav>

            <a href="index.html">
                INICIO
            </a>

            <a href="index.html#coleccion">
                COLECCIÓN
            </a>

            <a href="#">
                CAMISETAS
            </a>

            <a href="zapatos.html">
                ZAPATOS
            </a>

        </nav>

    </header>


    <main class="producto-pagina">


        <div class="galeria">

            <div class="producto-foto-grande">

                <img
                    id="fotoPrincipal"
                    src="IMAGEN/Nocta-orange.jpg"
                    alt="NIKE NOCTA X DRAKE TOTAL ORANGE"
                >

            </div>


            <div class="miniaturas">

                <button
                    type="button"
                    onclick="cambiarFoto('IMAGEN/Nocta-orange.jpg')"
                >

                    <img
                        src="IMAGEN/Nocta-orange.jpg"
                        alt="NIKE NOCTA X DRAKE - Foto 1"
                    >

                </button>


                <button
                    type="button"
                    onclick="cambiarFoto('IMAGEN/Nocta-orange-2.jpg')"
                >

                    <img
                        src="IMAGEN/Nocta-orange-2.jpg"
                        alt="NIKE NOCTA X DRAKE - Foto 2"
                    >

                </button>


                <button
                    type="button"
                    onclick="cambiarFoto('IMAGEN/Nocta-orange-3.jpg')"
                >

                    <img
                        src="IMAGEN/Nocta-orange-3.jpg"
                        alt="NIKE NOCTA X DRAKE - Foto 3"
                    >

                </button>

            </div>

        </div>


        <div class="producto-detalles">


            <p class="producto-marca">
                URBAN STREET PR
            </p>


            <h1>
                NIKE NOCTA X DRAKE
            </h1>


            <p class="producto-color">
                TOTAL ORANGE
            </p>


            <p class="producto-precio">
                75 €
            </p>


            <div class="campo">

                <label>
                    TALLA
                </label>

                <div class="tallas">

                    <button
                        type="button"
                        class="talla-activa"
                    >
                        43
                    </button>

                </div>

            </div>


            <div class="campo">

                <label>
                    CANTIDAD
                </label>

                <div class="cantidad">

                    <button
                        type="button"
                        onclick="cambiarCantidad(-1)"
                    >
                        −
                    </button>

                    <span id="cantidad">
                        1
                    </span>

                    <button
                        type="button"
                        onclick="cambiarCantidad(1)"
                    >
                        +
                    </button>

                </div>

            </div>


            <div class="pedido">

                <h2>
                    SOLICITAR PEDIDO
                </h2>


                <p class="pedido-descripcion">
                    Completa tus datos y nos pondremos
                    en contacto contigo para acordar
                    la entrega.
                </p>


                <form
                    action="https://formsubmit.co/urbanstreetpr2@gmail.com"
                    method="POST"
                >

                    <input
                        type="hidden"
                        name="_subject"
                        value="NUEVO PEDIDO - NIKE NOCTA X DRAKE TOTAL ORANGE"
                    >


                    <input
                        type="hidden"
                        name="_captcha"
                        value="false"
                    >


                    <input
                        type="hidden"
                        name="_template"
                        value="table"
                    >


                    <input
                        type="hidden"
                        name="_next"
                        value="https://urbanstreetpr2-code.github.io/pr-streetwear/CODE/pedido-confirmado.html"
                    >


                    <input
                        type="hidden"
                        name="Producto"
                        value="NIKE NOCTA X DRAKE"
                    >


                    <input
                        type="hidden"
                        name="Color"
                        value="TOTAL ORANGE"
                    >


                    <input
                        type="hidden"
                        name="Talla"
                        value="43"
                    >


                    <label for="nombre">
                        NOMBRE
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="Nombre"
                        placeholder="Tu nombre"
                        required
                    >


                    <label for="telefono">
                        TELÉFONO
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="Telefono"
                        placeholder="Tu teléfono"
                        required
                    >


                    <input
                        type="hidden"
                        id="cantidadPedido"
                        name="Cantidad"
                        value="1"
                    >


                    <label for="nota">
                        NOTA
                    </label>

                    <textarea
                        id="nota"
                        name="Nota"
                        placeholder="¿Quieres añadir alguna información?"
                    ></textarea>


                    <button
                        type="submit"
                        class="boton-pedido"
                    >
                        SOLICITAR PEDIDO
                    </button>

                </form>

            </div>

        </div>

    </main>


    <script>

        function cambiarFoto(ruta) {

            document.getElementById("fotoPrincipal").src = ruta;

        }


        let cantidadActual = 1;


        function cambiarCantidad(cambio) {

            cantidadActual = cantidadActual + cambio;


            if (cantidadActual < 1) {

                cantidadActual = 1;

            }


            document.getElementById("cantidad").textContent =
                cantidadActual;


            document.getElementById("cantidadPedido").value =
                cantidadActual;

        }

    </script>


</body>

</html>
